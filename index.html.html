<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>必必旅遊助手 PRO</title>
    
    <!-- Anson Kong Icon -->
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzQ7qKzY4QzQzQzQzQzQzQzQzQzQzQzQzQzQ&s">
    <link rel="apple-touch-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzQ7qKzY4QzQzQzQzQzQzQzQzQzQzQzQzQzQ&s">

    <!-- CDN 資源載入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* 隱藏 Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 全域設定 */
        body { background-color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        /* 手機外框陰影 */
        .mobile-frame { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        /* 圖片轉場動畫 */
        .img-fade-enter-active, .img-fade-leave-active { transition: opacity 0.6s ease-in-out; }
        .img-fade-enter-from, .img-fade-leave-to { opacity: 0; }
        .img-fade-enter-to, .img-fade-leave-from { opacity: 1; }
        
        /* 確保圖片疊加 */
        .img-wrapper { position: absolute; inset: 0; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
        
        /* 輸入框 Focus 時的樣式 */
        input:focus { outline: none; }

        /* 隱藏檔案上傳原始 Input */
        .hidden-input { display: none; }
    </style>
</head>
<body>

<div id="app" class="min-h-screen flex items-center justify-center p-0 md:p-6">
    
    <!-- App 容器 -->
    <div class="bg-gray-50 w-full max-w-[400px] h-[100vh] md:h-[850px] md:rounded-[40px] overflow-hidden relative flex flex-col mobile-frame border-4 border-gray-800">

        <!-- 全域背景圖 (Updated v17) -->
        <div class="absolute inset-0 z-0 bg-white">
            <img src="https://ztylez.com/wp-content/uploads/2025/08/ANSON-KONG_Webpage-07-copy-2-%E8%A4%87%E6%9C%AC-2.webp" 
                 class="w-full h-full object-cover opacity-35" 
                 style="object-position: center top;">
        </div>

        <!-- 1. 動態頁首 Header (層級提高 z-20) -->
        <div class="relative h-64 bg-gray-900 shrink-0 overflow-hidden group z-20 shadow-xl">
            <!-- 背景圖切換區 -->
            <transition-group name="img-fade">
                <div :key="currentDayData.image" class="img-wrapper">
                    <img :src="currentDayData.image" alt="Header Image">
                </div>
            </transition-group>
            
            <!-- 黑色漸層遮罩 -->
            <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent z-10"></div>
            
            <!-- 內容區 -->
            <div class="absolute bottom-0 left-0 right-0 p-5 z-20 text-white pb-8">
                <div class="flex justify-between items-end">
                    <div class="flex-1 mr-4">
                        <div class="flex items-center gap-2 mb-2">
                            <!-- Day + 日期顯示 -->
                            <span class="bg-blue-600 text-[11px] font-bold px-3 py-1 rounded-full tracking-wide shadow-lg shadow-blue-900/50 flex items-center gap-2">
                                <span>Day {{ currentDay }}</span>
                                <span class="w-[1px] h-3 bg-blue-400/50"></span>
                                <span class="font-medium text-blue-50">{{ getDateStr(currentDay) }}</span>
                            </span>
                            <span class="text-xs text-gray-300 font-medium ml-1"><i class="fas fa-map-marker-alt text-red-500 mr-1"></i>Taipei</span>
                        </div>
                        <!-- 主題標題 -->
                        <h1 class="text-2xl font-bold leading-tight shadow-black drop-shadow-md line-clamp-2">
                            {{ currentDayData.theme }}
                        </h1>
                    </div>
                    
                    <!-- 天氣 Widget -->
                    <div class="bg-white/10 backdrop-blur-md border border-white/20 p-2.5 rounded-2xl text-center min-w-[75px] shadow-lg">
                        <div v-if="weather.temp !== null">
                            <div class="text-2xl font-bold text-white tracking-tighter">{{ weather.temp }}°</div>
                            <div class="text-[10px] text-blue-100 font-medium mt-0.5">{{ weather.desc }}</div>
                        </div>
                        <div v-else class="text-[10px] text-gray-300 animate-pulse py-2">
                            Loading..
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 內容滾動區 (透明背景以顯示底圖) -->
        <div class="flex-1 overflow-y-auto no-scrollbar pb-24 relative z-10 rounded-t-3xl -mt-4 bg-transparent">
            
            <!-- Tab 0: 準備清單 Checklist -->
            <div v-if="activeTab === 'checklist'" class="p-5 space-y-5">
                
                <!-- 進度條 -->
                <div class="bg-blue-100 p-4 rounded-2xl shadow-sm border border-blue-200">
                    <div class="flex justify-between items-end mb-2">
                        <h2 class="text-lg font-bold text-gray-800">行李清單</h2>
                        <span class="text-xs font-bold text-blue-600">{{ checklistProgress }}% 完成</span>
                    </div>
                    <div class="w-full bg-white rounded-full h-2.5">
                        <div class="bg-blue-600 h-2.5 rounded-full transition-all duration-500" :style="{ width: checklistProgress + '%' }"></div>
                    </div>
                </div>

                <!-- 清單列表 -->
                <div class="space-y-3">
                    <div v-for="item in checklist" :key="item.id" 
                         @click="toggleCheck(item.id)"
                         class="bg-blue-100 p-4 rounded-xl border border-blue-200 shadow-sm flex items-center gap-4 cursor-pointer transition-all active:scale-95 group hover:bg-blue-200/50">
                        
                        <!-- Icon -->
                        <div :class="item.checked ? 'bg-green-100 text-green-600' : 'bg-white text-blue-500'" 
                             class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 transition-colors shadow-sm">
                            <i :class="['fas', item.icon]"></i>
                        </div>

                        <!-- Text -->
                        <div class="flex-1">
                            <h3 :class="item.checked ? 'text-gray-400 line-through' : 'text-gray-800'" class="font-bold text-sm transition-all">{{ item.text }}</h3>
                            <p class="text-[10px] text-gray-500">{{ item.desc }}</p>
                        </div>

                        <!-- Checkbox UI -->
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all"
                             :class="item.checked ? 'border-green-500 bg-green-500' : 'border-blue-300 bg-white'">
                            <i v-if="item.checked" class="fas fa-check text-white text-xs"></i>
                        </div>
                    </div>
                </div>
                
                <!-- 重置按鈕 -->
                <div class="text-center pt-4 pb-10">
                    <button @click="resetChecklist" class="text-xs text-gray-500 underline hover:text-red-500 font-bold bg-white/50 px-3 py-1 rounded-full">重置所有清單</button>
                </div>
            </div>

            <!-- Tab 1: 行程表 -->
            <div v-if="activeTab === 'itinerary'" class="p-5 space-y-5">
                <!-- 日期選擇器 -->
                <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar snap-x">
                    <button v-for="d in 5" :key="d" 
                        @click="currentDay = d"
                        :class="currentDay === d ? 'bg-blue-600 text-white shadow-lg ring-2 ring-offset-2 ring-blue-600 scale-105' : 'bg-blue-100 text-gray-500 border border-blue-200 hover:border-blue-400'"
                        class="flex-shrink-0 w-14 h-16 rounded-2xl flex flex-col items-center justify-center transition-all duration-300 snap-center">
                        <span class="text-[10px] font-bold uppercase tracking-widest mb-1 opacity-70">Day</span>
                        <span class="text-xl font-bold">{{ d }}</span>
                    </button>
                </div>
